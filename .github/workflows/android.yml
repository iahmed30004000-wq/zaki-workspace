# THE ANDROID APP IS BUILT HERE, NOT ON ANYBODY'S COMPUTER.
#
# `android/` is a tiny Trusted Web Activity: the site in a full-screen window with its own icon. Nothing of the site is copied into it, so
# every page and every update comes from https://workspace.zakiai.io and this file is run only when the WRAPPER changes (or by hand).
#
# The APK is signed with ONE fixed key kept as the repository secret ANDROID_KEYSTORE_B64 (never a file in git): it makes every new build install over the
# old one and lets Chrome hide its address bar (public/.well-known/assetlinks.json). Without the secret it falls back to the debug key. See docs/ANDROID.md.
#
# The finished file is published as the release «android-latest» (a stable link for the phone) and kept as a run artifact.
name: Android

on:
  # ON A PULL REQUEST IT BUILDS AND PUBLISHES NOTHING (the release step below runs on main only)
  pull_request:
    paths:
      - 'android/**'
      - 'public/icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/icons/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept the Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Put the signing key in place (only when the repository has it)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/zaki.p12
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this build is signed with the debug key (see docs/ANDROID.md)"
          fi

      - name: Build the signed APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk zaki-workspace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zaki-workspace-apk
          path: zaki-workspace.apk
          retention-days: 30

      - name: Publish the stable link (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest zaki-workspace.apk \
            --title "Zaki Workspace for Android" \
            --notes "The Android app of Zaki Workspace (the site in a full-screen window). Install it on the phone: allow installs from this source, open the file. Built from ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
