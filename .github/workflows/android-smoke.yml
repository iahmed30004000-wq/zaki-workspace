# THE ANDROID APP IS OPENED ON A REAL (EMULATED) PHONE HERE BEFORE ANYBODY INSTALLS IT.
#
# Builds the app, starts an Android emulator, installs it, opens it, tries to sign in with a WRONG password (so the app's real round trip to
# https://workspace.zakiai.io is proven without any account), and keeps the screenshots and the log as a run artifact. It fails when the app
# crashes (a FATAL EXCEPTION of its own process) or when the sign-in screen never appears.
name: Android smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-smoke.yml'

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept the Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: smoke-out
          retention-days: 14
