plugins {
    id 'com.android.application'
}

android {
    namespace 'io.zakiai.workspace'
    compileSdk 34

    defaultConfig {
        applicationId 'io.zakiai.workspace'
        minSdk 26
        targetSdk 34
        // raised by hand when the wrapper itself changes; the site updates itself
        versionCode 3
        versionName '2.0'
    }

    // ONE fixed key for every build, so a new build installs over the old app and Chrome can prove the site belongs to the app
    // (public/.well-known/assetlinks.json carries this key's fingerprint). The key file is NOT in git: the workflow writes android/zaki.p12 from the
    // repository secret ANDROID_KEYSTORE_B64. Without it (a pull request from a fork, a build on a computer) the build falls back to the debug key.
    def zakiKey = file('../zaki.p12')
    signingConfigs {
        zaki {
            storeFile zakiKey
            storeType 'pkcs12'
            storePassword 'zakiworkspace'
            keyAlias 'zaki'
            keyPassword 'zakiworkspace'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig zakiKey.exists() ? signingConfigs.zaki : signingConfigs.debug
        }
        debug {
            signingConfig zakiKey.exists() ? signingConfigs.zaki : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
