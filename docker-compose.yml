services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaki_local}
      POSTGRES_DB: zaki_workspace
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaki -d zaki_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Not used by the application yet: nothing in the code connects to Redis (the planned
  # realtime layer uses Postgres LISTEN/NOTIFY instead). Kept so the service name and
  # port stay reserved; it can be removed from `app.depends_on` and from this file
  # without touching any code.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace
      # Required (16+ characters). Not enforced here with `:?` because Compose evaluates that for
      # EVERY service, which made the very first documented step (`docker compose up db -d`) fail on a
      # fresh clone. The app refuses to boot without it (src/instrumentation.ts), with a clear message.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Optional. Empty = the key for secrets at rest is derived from AUTH_SECRET (the old
      # behaviour). Set it to a separate random value (openssl rand -hex 32) so rotating
      # AUTH_SECRET no longer breaks the stored Telegram / n8n / Google secrets, then run
      # scripts/reencrypt-secrets.ts once.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Uploaded files. Must be the same path as the volume mounted below (the Dockerfile
      # creates it and gives it to the runtime user), so it is fixed here on purpose.
      UPLOAD_DIR: /app/storage/uploads
      NODE_ENV: production
      # Who runs the background jobs (backup, mailbox, embeddings, orders sync, reminders). Empty / 0 (the default): THIS process, as
      # it always has. 1: only the `worker` service below does, and this process stops scheduling. WARNING: with 1 and no
      # worker running, nothing runs the jobs. FIX: start the worker service first (docs: README, JOBS_IN_WORKER).
      JOBS_IN_WORKER: ${JOBS_IN_WORKER:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage/uploads

  # The job worker (F1.9). It runs src/server/jobs/scheduler.ts `runJobsWorker`: with JOBS_IN_WORKER=1 it schedules the
  # background jobs (the same advisory lock as the app, so two processes never both work a tick); with it empty / 0 it only
  # proves the database connection every minute and the app keeps the jobs. It runs the app's own code, so it needs the
  # app's whole environment (a job decrypts a mailbox with ENCRYPTION_KEY, sends mail with SMTP_*, writes the backup to
  # Google Drive with GOOGLE_*), and the same uploads volume. The image keeps tsx and the "@/..." alias (tsconfig.json).
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "tsx", "-e", "import('./src/server/jobs/scheduler').then((m) => m.runJobsWorker())"]
    # The image's HEALTHCHECK probes the web server on port 3000. The worker serves nothing,
    # so the inherited check would report it unhealthy for ever.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace
      AUTH_SECRET: ${AUTH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/storage/uploads
      NODE_ENV: production
      LOG_LEVEL: info
      JOBS_IN_WORKER: ${JOBS_IN_WORKER:-}
      # the integrations a job uses (empty = not set up): the backup to Drive, the company mailbox, mail, the embeddings service
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMBED_URL: ${EMBED_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MIN_SCORE: ${EMBED_MIN_SCORE:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - uploads:/app/storage/uploads

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace

volumes:
  db_data:
  redis_data:
  uploads:
