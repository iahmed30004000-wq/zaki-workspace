# For Coolify («Docker Compose» build pack, base directory /voice-agent): the secret is generated by Coolify itself,
# the owner only copies it once into the site's VOICE_AGENT_SECRET. See README.md.
services:
  voice-agent:
    build:
      context: .
    restart: unless-stopped
    environment:
      - VOICE_AGENT_SECRET=${SERVICE_PASSWORD_VOICEAGENT}
      - WORKSPACE_TURN_URL=${WORKSPACE_TURN_URL:-https://workspace.zakiai.io/api/voice-agent/turn}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - MAX_SESSIONS=${MAX_SESSIONS:-2}
      - TASHKEEL=${TASHKEEL:-1}
      # who speaks: edge (Microsoft neural voice, the default) | gemini (needs GEMINI_API_KEY, the owner's own) | piper (local only)
      # speed and diagnosis: timings are always in the log; VOICE_DEBUG=1 adds what was said; VOICE_FILLER=0 drops the spoken «one moment»
      - VOICE_DEBUG=${VOICE_DEBUG:-0}
      - VOICE_FILLER=${VOICE_FILLER:-0}
      - WHISPER_THREADS=${WHISPER_THREADS:-0}
      # who listens: local (default, nothing leaves the server) | groq (needs GROQ_API_KEY, the owner's own; every sentence goes to Groq)
      - STT_ENGINE=${STT_ENGINE:-local}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3}
      - TTS_ENGINE=${TTS_ENGINE:-edge}
      # the voice: for a Levantine sound try EDGE_VOICE=ar-JO-TaimNeural; EDGE_RATE is its speed (+10% faster, -10% slower)
      - EDGE_VOICE=${EDGE_VOICE:-ar-SA-HamedNeural}
      - EDGE_RATE=${EDGE_RATE:-+0%}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_VOICE=${GEMINI_VOICE:-Kore}
      - GEMINI_TTS_MODEL=${GEMINI_TTS_MODEL:-gemini-3.8-flash-lite-tts}
      # the local Piper voice (the backup of edge and gemini); EMPTY = the voice's own setting
      - PIPER_LENGTH_SCALE=${PIPER_LENGTH_SCALE:-}
      - PIPER_NOISE_SCALE=${PIPER_NOISE_SCALE:-}
      - PIPER_NOISE_W=${PIPER_NOISE_W:-}
      - PIPER_SENTENCE_SILENCE=${PIPER_SENTENCE_SILENCE:-}
      # a hint for the recogniser so it knows the assistant's names (a single space sends none)
      - STT_PROMPT=${STT_PROMPT:-اجتماع عمل. المساعد زاكي يشارك فيه.}
      - VOICE_FILLER_TEXT=${VOICE_FILLER_TEXT:-حسنًا، لحظة من فضلك.}
    volumes:
      - voice-models:/models
    expose:
      - "8080"

volumes:
  voice-models:
