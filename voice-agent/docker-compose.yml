# For Coolify («Docker Compose» build pack, base directory /voice-agent): the secret is generated by Coolify itself,
# the owner only copies it once into the site's VOICE_AGENT_SECRET. See README.md.
services:
  voice-agent:
    build:
      context: .
    restart: unless-stopped
    environment:
      - VOICE_AGENT_SECRET=${SERVICE_PASSWORD_VOICEAGENT}
      - WORKSPACE_TURN_URL=${WORKSPACE_TURN_URL:-https://workspace.zakiai.io/api/voice-agent/turn}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - MAX_SESSIONS=${MAX_SESSIONS:-2}
      - TASHKEEL=${TASHKEEL:-1}
      # who speaks: edge (Microsoft neural voice, the default) | gemini (needs GEMINI_API_KEY, the owner's own) | piper (local only)
      - TTS_ENGINE=${TTS_ENGINE:-edge}
      - EDGE_VOICE=${EDGE_VOICE:-ar-SA-HamedNeural}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_VOICE=${GEMINI_VOICE:-Kore}
    volumes:
      - voice-models:/models
    expose:
      - "8080"

volumes:
  voice-models:
