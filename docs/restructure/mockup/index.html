<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>معاينة زاكي — شكل الدردشة الجديد</title>
<style>
:root{--surface:light-dark(#e9eff4,#0e1621);--surface1:light-dark(#ffffff,#17212b);--surface2:light-dark(#f0f3f6,#202b36);--surface3:light-dark(#e4e9ee,#2b3947);--border:light-dark(#e1e6eb,#233140);--fg:light-dark(#0f1923,#f1f5f9);--fg2:light-dark(#56636f,#9fb0c0);--muted:light-dark(#687581,#8496a8);--accent:light-dark(#2672c8,#5eadf2);--accentfg:light-dark(#ffffff,#06131f);--accentsoft:light-dark(#2672c81f,#5eadf229);--accent2:light-dark(#e0a23a,#f0b955);--ok:light-dark(#1f8a54,#4fca8b);--oksoft:light-dark(#1f8a541f,#4fca8b26);--warn:light-dark(#a86d05,#e6b150);--warnsoft:light-dark(#c98a121f,#e6b15024);--danger:light-dark(#cf3d3d,#f07b7b);--dangersoft:light-dark(#cf3d3d1a,#f07b7b26);--bout:light-dark(#d6e9ff,#2b5378);--boutfg:light-dark(#0e2135,#f3f8fd);--boutmeta:light-dark(#47709c,#a9cbec);--bin:light-dark(#ffffff,#182533);--binfg:light-dark(#0f1923,#f1f5f9);--wall:light-dark(#cddde8,#0b131c);--pattern:light-dark(#5d88ad42,#6f93b330);--svc:light-dark(#3c566d8c,#00000066);--badgemuted:light-dark(#aeb9c4,#4b5b6c);--shadow:light-dark(#0f192329,#00000080);--scrim:light-dark(#0a121a73,#00000099);--stage:light-dark(#d5dde5,#05090e);color-scheme:light dark;}:root:has(> head > meta[name="color-scheme"][content="dark"]){color-scheme:dark}:root:has(> head > meta[name="color-scheme"][content="light"]){color-scheme:light}
/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html,body{block-size:100%}
body{font:15px/1.45 "IBM Plex Sans Arabic","Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif;background:var(--stage);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;accent-color:var(--accent);scrollbar-color:var(--badgemuted) transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{inline-size:20px;block-size:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{inline-size:15px;block-size:15px}
.ic.l{inline-size:24px;block-size:24px}
.dim{color:var(--muted)}
bdi{direction:ltr;unicode-bidi:isolate}
small{font-size:12.5px}

/* ---------- the preview's own bar (not part of the app) ---------- */
.mk-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0f1822;color:#e9eff5;flex:none;font-size:13.5px}
.mk-t{font-weight:700;white-space:nowrap}
.mk-t small{font-weight:400;color:#9fb0c0;margin-inline-start:8px}
.mk-sp{flex:1}
.mk-seg{display:inline-flex;background:#1c2835;border-radius:9px;padding:2px;flex:none}
.mk-seg button{padding:5px 10px;border-radius:7px;color:#b9c6d3;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.mk-seg button.on{background:#2f7fd6;color:#fff}
.mk-btn{padding:5px 10px;border-radius:9px;background:#1c2835;color:#e9eff5;white-space:nowrap;flex:none}
.to-light{display:none}
@media (prefers-color-scheme:dark){.to-light{display:inline}.to-dark{display:none}}
:root:has(> head > meta[name="color-scheme"][content="dark"]) .to-light{display:inline}
:root:has(> head > meta[name="color-scheme"][content="dark"]) .to-dark{display:none}
:root:has(> head > meta[name="color-scheme"][content="light"]) .to-light{display:none}
:root:has(> head > meta[name="color-scheme"][content="light"]) .to-dark{display:inline}
.mk-tour{display:flex;gap:6px;padding:6px 12px;background:#16212d;overflow-x:auto;flex:none;scrollbar-width:none;align-items:center}
.mk-tour b{color:#9fb0c0;font-size:12.5px;white-space:nowrap;font-weight:600}
.mk-tour button{white-space:nowrap;padding:4px 11px;border-radius:14px;background:#22303f;color:#d6e0ea;font-size:13px}
.mk-tour button.on{background:#e0a23a;color:#1a1204;font-weight:700}
.mk-cap{background:#16212d;color:#f0d9a8;font-size:13px;padding:0 12px 7px;flex:none}
.mk-cap:empty{display:none}
.mk-stage{flex:1;min-block-size:0;display:grid;place-items:center;overflow:hidden;position:relative}
.mk-fit{position:relative}
.device{position:absolute;inset-block-start:0;left:0;transform-origin:0 0;display:flex;flex-direction:column;background:var(--surface1);overflow:hidden}
.device.phone{border-radius:34px;box-shadow:0 0 0 9px #0b1016,0 0 0 11px #303a45,0 24px 50px #0006}
.device.desk{border-radius:10px;box-shadow:0 8px 34px #0004}
.device.fluid,.device.native{position:static;inline-size:100%;block-size:100%}
.sbar{display:none}
.device.phone .sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 24px 3px;font-size:12.5px;font-weight:700;background:var(--surface1);color:var(--fg);flex:none;direction:ltr}
@media (max-width:700px){.mk-t small,.mk-dev{display:none}.mk-bar{padding:5px 8px;gap:6px}.mk-tour{padding:5px 8px}}

/* ---------- the app ---------- */
.app{container:app/inline-size;flex:1;min-block-size:0;position:relative;display:flex;background:var(--surface);overflow:hidden;--fs:1;--wp:none}
.boot{margin:auto;padding:24px;text-align:center;color:var(--fg2)}
.rail{inline-size:72px;flex:none;background:var(--surface1);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;z-index:2}
.logo{inline-size:40px;block-size:40px;border-radius:12px;background:var(--accent);color:var(--accentfg);display:grid;place-items:center;font-weight:800;font-size:21px;margin-block-end:8px;position:relative;flex:none}
.logo::after{content:"";position:absolute;inset-block-start:-4px;inset-inline-end:-4px;inline-size:13px;block-size:13px;background:var(--accent2);clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%)}
.rb{inline-size:64px;padding:7px 2px 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg2);font-size:10.5px;font-weight:600;position:relative;text-align:center;flex:none}
.rb:hover{background:var(--surface2)}
.rb.on{color:var(--accent);background:var(--accentsoft)}
.rb .bd{position:absolute;inset-block-start:1px;inset-inline-end:6px}
.rail .grow{flex:1}
.bd{min-inline-size:20px;block-size:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accentfg);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;flex:none;line-height:1}
.bd.mu{background:var(--badgemuted);color:#fff}
.bd.at{padding:0}
.main{flex:1;min-inline-size:0;display:flex;flex-direction:column;position:relative}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 18px;min-block-size:56px;background:var(--surface1);border-block-end:1px solid var(--border);flex:none;flex-wrap:wrap}
.pbar h1{font-size:19px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{padding:7px 13px;border-radius:9px;color:var(--fg2);font-weight:600;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:var(--surface2)}
.tab.on{background:var(--accentsoft);color:var(--accent)}
.body{flex:1;min-block-size:0;overflow:auto;padding:18px 20px 28px}
.wrap{max-inline-size:1040px;margin-inline:auto}
.phn{display:none}
.grow{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-block-size:40px;padding:0 16px;border-radius:10px;font-weight:600;white-space:nowrap;transition:background .12s,filter .12s}
.btn.sm{min-block-size:32px;padding:0 11px;font-size:13.5px;border-radius:8px}
.btn.pri{background:var(--accent);color:var(--accentfg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ton{background:var(--accentsoft);color:var(--accent)}
.btn.gho:hover,.btn.ton:hover{background:var(--surface3)}
.btn.out{box-shadow:inset 0 0 0 1px var(--border)}
.btn.dan{background:var(--danger);color:#fff}
.btn.wide{inline-size:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{color:var(--accent);font-weight:600}
.ibtn{inline-size:40px;block-size:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg2);flex:none}
.ibtn:hover{background:var(--surface2)}
.ibtn.sm{inline-size:30px;block-size:30px}
.fab{position:absolute;inset-block-end:18px;inset-inline-end:18px;inline-size:56px;block-size:56px;border-radius:50%;background:var(--accent);color:var(--accentfg);place-items:center;box-shadow:0 6px 16px var(--shadow);z-index:3}

/* small pieces */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:13px;background:var(--surface2);color:var(--fg2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accentfg)}
.chip.ok{background:var(--oksoft);color:var(--ok)}
.chip.wr{background:var(--warnsoft);color:var(--warn)}
.chip.dg{background:var(--dangersoft);color:var(--danger)}
.chip.ac{background:var(--accentsoft);color:var(--accent)}
.chip.wrapx{white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.list{background:var(--surface1);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;min-block-size:56px;position:relative;inline-size:100%}
.row + .row::before{content:"";position:absolute;inset-block-start:0;inset-inline:14px;border-block-start:1px solid var(--border)}
.row[data-a]{cursor:pointer}
.row[data-a]:hover{background:var(--surface2)}
.row .g{flex:1;min-inline-size:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{color:var(--fg2);font-size:14px;white-space:nowrap}
.sect{font-size:13px;font-weight:700;color:var(--accent);padding:14px 14px 6px}
.av{inline-size:40px;block-size:40px;border-radius:50%;background:hsl(var(--h,210) 50% 50%);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none;font-size:16px;line-height:1}
.av.lg{inline-size:54px;block-size:54px;font-size:21px}
.av.sm{inline-size:30px;block-size:30px;font-size:13px}
.av.xl{inline-size:84px;block-size:84px;font-size:33px}
.av.em{background:hsl(var(--h,210) 60% 88%);font-size:19px}
.av.em.lg{font-size:26px}
.av.em.xl{font-size:40px}
.av.sv{background:var(--accent);color:var(--accentfg)}
.sw{inline-size:42px;block-size:24px;border-radius:12px;background:var(--badgemuted);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;inset-block-start:3px;inset-inline-start:3px;inline-size:18px;block-size:18px;border-radius:50%;background:#fff;transition:translate .15s;box-shadow:0 1px 2px #0003}
.sw.on{background:var(--accent)}
.sw.on::after{translate:-18px 0}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;flex:none}
.seg button{padding:5px 12px;border-radius:8px;font-weight:600;color:var(--fg2);font-size:13.5px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.seg button.on{background:var(--surface1);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.seg.wide{display:flex}
.seg.wide button{flex:1;justify-content:center}
.wf{border-radius:12px;background:var(--warnsoft);padding:10px 12px;font-size:13.5px;display:grid;gap:4px}
.wf .w{color:var(--warn);font-weight:700}
.card{background:var(--surface1);border-radius:14px;padding:14px 16px;min-inline-size:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.h2{font-size:15px;font-weight:700;margin-block-end:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s2{font-size:13.5px;color:var(--fg2)}
.emp{padding:28px 16px;text-align:center;color:var(--fg2)}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-block-end:12px}
.card .row{padding-inline:0}
.card .row + .row::before{inset-inline:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 6px;display:grid;gap:2px;text-align:center}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--fg2)}
.qadd{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:10px;padding:0 10px;block-size:40px;margin-block-start:8px;color:var(--muted)}
.qadd input{flex:1;min-inline-size:0}

/* ---------- chat ---------- */
.chat{flex:1;min-block-size:0;display:flex;position:relative}
.clist{inline-size:364px;flex:none;display:flex;flex-direction:column;background:var(--surface1);border-inline-end:1px solid var(--border);min-block-size:0;position:relative}
.chead{display:flex;align-items:center;gap:6px;padding:8px 10px;min-block-size:56px;flex:none}
.chead h1{font-size:19px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .g{flex:1;min-inline-size:0}
.chead .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .s{font-size:13px;color:var(--fg2)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:20px;padding:0 12px;block-size:38px;color:var(--muted);min-inline-size:0}
.search input{flex:1;min-inline-size:0}
.folders{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none;border-block-end:1px solid var(--border);flex:none}
.fold{padding:9px 9px 7px;color:var(--fg2);font-weight:600;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;border-block-end:3px solid transparent;font-size:14px}
.fold.on{color:var(--accent);border-color:var(--accent)}
.rows{flex:1;min-block-size:0;overflow-y:auto;padding-block:4px}
.crow{display:flex;gap:11px;align-items:center;padding:0 10px;block-size:72px;cursor:pointer;position:relative;border-radius:10px;margin-inline:6px}
.crow:hover{background:var(--surface2)}
.crow.sel{background:var(--accent);color:var(--accentfg)}
.crow.sel .pv,.crow.sel .tm,.crow.sel .dim,.crow.sel .acc,.crow.sel .dng,.crow.sel .tk{color:inherit;opacity:.88}
.crow.sel .bd{background:var(--accentfg);color:var(--accent)}
.crow.sel .tchip,.crow.sel .spc{background:#ffffff2e;color:inherit}
.crow.arc{block-size:52px;color:var(--fg2)}
.cl{flex:1;min-inline-size:0;display:grid;gap:3px}
.l1,.l2{display:flex;align-items:center;gap:5px;min-inline-size:0}
.ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{margin-inline-start:auto;font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:3px;align-items:center;font-variant-numeric:tabular-nums;padding-inline-start:6px}
.tk{color:var(--accent)}
.pv{flex:1;min-inline-size:0;color:var(--fg2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc{color:var(--accent)}
.dng{color:var(--danger)}
.l2 .chips{flex-wrap:nowrap;gap:4px;flex:none;max-inline-size:66%;overflow:hidden}
.tchip{font-size:12.5px;padding:1px 7px;border-radius:9px;background:var(--surface2);color:var(--fg2);white-space:nowrap;flex:none}
.tchip.un{color:var(--fg);font-weight:700}
.spc{font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.avw{position:relative;flex:none;display:inline-flex}
.avw .on{position:absolute;inset-block-end:1px;inset-inline-end:1px;inline-size:13px;block-size:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface1)}
.conv{flex:1;min-inline-size:0;display:flex;flex-direction:column;position:relative;background:var(--wall)}
.cvh{display:flex;align-items:center;gap:10px;padding:6px 12px;min-block-size:56px;background:var(--surface1);border-block-end:1px solid var(--border);flex:none;z-index:2}
.cvh .g{flex:1;min-inline-size:0;cursor:pointer}
.cvh .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvh .s{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinb{display:flex;gap:8px;align-items:center;padding:6px 14px;background:var(--surface1);border-block-end:1px solid var(--border);font-size:13.5px;flex:none;z-index:1}
.pinb::before{content:"";inline-size:3px;align-self:stretch;background:var(--accent);border-radius:2px;flex:none}
.pinb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.privb{display:flex;gap:8px;align-items:center;padding:7px 14px;background:var(--surface1);border-block-end:1px solid var(--border);border-inline-start:4px solid var(--warn);font-size:13px;flex:none;z-index:1}
.vp{flex:1;min-block-size:0;position:relative}
.vp::before{content:"";position:absolute;inset:0;background:var(--pattern);-webkit-mask:var(--wp) 0 0/150px;mask:var(--wp) 0 0/150px;pointer-events:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.msgs{display:flex;flex-direction:column;gap:2px;padding:12px 16px 8px;max-inline-size:880px;margin-inline:auto;min-block-size:100%;justify-content:flex-end}
.m{display:flex;gap:8px;align-items:flex-end;position:relative}
.m.out{flex-direction:row-reverse}
.m.first{margin-block-start:8px}
.m .avs{inline-size:34px;flex:none;display:flex}
.bw{display:flex;flex-direction:column;gap:4px;max-inline-size:min(78%,540px);align-items:flex-start;min-inline-size:0}
.m.out .bw{align-items:flex-end}
.b{position:relative;padding:6px 10px;border-radius:17px;background:var(--bin);color:var(--binfg);box-shadow:0 1px 1.5px #0000001f;font-size:calc(15px*var(--fs));overflow-wrap:anywhere;max-inline-size:100%}
.m.out .b{background:var(--bout);color:var(--boutfg)}
.m.in.last .b{border-end-start-radius:5px}
.m.out.last .b{border-end-end-radius:5px}
.m.hl .b{animation:hl 2s}
.who{font-size:13.5px;font-weight:700;color:hsl(var(--h) 55% 48%);color:light-dark(hsl(var(--h) 62% 38%),hsl(var(--h) 70% 72%));margin-block-end:1px;display:flex;gap:6px;align-items:center}
.via{font-size:11px;font-weight:700;padding:0 6px;border-radius:7px;background:var(--surface2);color:var(--fg2)}
.tx{white-space:pre-wrap}
.tx::after{content:"";display:inline-block;inline-size:54px}
.m.out .tx::after{inline-size:74px}
.meta{position:absolute;inset-block-end:5px;inset-inline-end:10px;display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums;line-height:1}
.m.out .meta{color:var(--boutmeta)}
.meta .ic{inline-size:15px;block-size:15px}
.b.blk{padding:9px 10px 7px}
.b.blk .meta{position:static;display:flex;justify-content:flex-start;margin-block-start:5px}
.rp{display:grid;inline-size:100%;border-inline-start:3px solid var(--accent);background:var(--accentsoft);border-radius:6px;padding:3px 8px;margin-block-end:4px;font-size:13.5px}
.rp b{color:var(--accent);font-size:13px}
.rp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-block:4px 14px}
.rc{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border-radius:12px;background:var(--accentsoft);font-size:13px;font-weight:700;color:var(--accent)}
.rc.me{box-shadow:inset 0 0 0 1.5px var(--accent)}
.svc{align-self:center;background:var(--svc);color:#fff;padding:3px 11px;border-radius:12px;font-size:12.5px;font-weight:600;margin-block:8px 4px;display:inline-flex;gap:6px;align-items:center}
.unsep{text-align:center;background:var(--surface1);color:var(--accent);font-size:13px;font-weight:600;padding:4px;margin:8px 0;border-radius:8px}
.mact{opacity:0;align-self:center;background:var(--surface1);box-shadow:0 1px 2px var(--shadow)}
.m:hover .mact{opacity:1}
.men{color:var(--accent);font-weight:600}

  const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  S.p = q.p || 'chat';
  if (q.m) S.mode = q.m;
  S.open = 'c' in q;
  if (q.c) S.c = q.c;
  S.f = q.f || null;
  S.role = q.r || 'owner';
  S.tab = q.tab || ({ work: 'mine', library: 'products', admin: 'overview' }[S.p] || '');
  if (q.sec) { if (S.p === 'settings') S.setsec = q.sec; else S.sec = q.sec; }
  S.fbOpen = !!q.fb;
  S.slash = q.o === 'slash';
  S.prod = null; S.menu = null; S.drawer = false; S.collage = false;
  const o = q.o || '';
  if (o.startsWith('product:')) { S.p = 'library'; S.tab = 'products'; S.prod = o.slice(8); }
  if (o.startsWith('person:')) { S.p = 'admin'; S.sec = 'people'; S.person = o.slice(7); }
}

// ---------- shared pieces ----------
function pbar(title, tabs = '', extra = '') {
  return `<header class="pbar"><button class="ibtn phn" data-act="drawer" aria-label="القائمة">${ic('menu')}</button><h1>${title}</h1>${tabs ? `<nav class="tabs">${tabs}</nav>` : ''}<span class="grow"></span>${extra}</header>`;
}
function acc(id, title, body, copyKey) {
  return `<section class="acc ${isOpen(id) ? 'op' : ''}"><div class="acch"><button class="tg" data-act="acc" data-id="${id}">${ic('down', 's chev')}<span>${title}</span></button>${copyKey ? `<button class="cpy" data-act="copyText" data-id="${copyKey}">${ic('copy', 's')}انسخي</button>` : ''}</div><div class="accb">${body}</div></section>`;
}
function showToast(msg) {
  S.toast = msg; render();
  clearTimeout(toastT);
  toastT = setTimeout(() => { S.toast = null; render(); }, 1800);
}
function copyText(txt, msg) {
  const done = () => showToast(msg || 'انتسخ ✓');
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = txt; t.setAttribute('readonly', '');
    t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e) { /* the preview has no clipboard: say so below */ }
    t.remove(); done();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
}

// ---------- chat ----------
const FOLDERS = [['all', 'الكل'], ['unread', 'غير مقروء'], ['priv', 'خاص'], ['spaces', 'المساحات']];
function lastOf(id) {
  const arr = MSGS[id] || [];
  const m = [...arr].reverse().find((x) => x.kind !== 'calls');
  if (!m) return '';
  const who = m.from === 'me' ? 'أنت' : (PEOPLE[m.from] ? PEOPLE[m.from].n : '');
  return `${CONVS[id].k === 'topic' ? esc(who) + ': ' : ''}${esc(kindLabel(m).slice(0, 90))}`;
}
function convRow(id) {
  const c = CONVS[id]; const isDm = c.k === 'dm';
  const lead = isDm ? `<span class="avw">${av(c.who)}${c.online ? '<i class="on"></i>' : ''}</span>`
    : c.k === 'saved' ? `<span class="av sv">${ic('save', 's')}</span>`
    : `<span class="av em" style="--h:${hueOf(c.sp)}">${c.e}</span>`;
  const title = isDm ? PEOPLE[c.who].n : c.n;
  const sp = c.sp ? `<span class="spc">${SPACES[c.sp].n}</span>` : '';
  const prev = c.draft ? `<span class="dng">مسودة:</span> ${esc(c.draft)}` : lastOf(id);
  return `<div class="crow ${S.c === id ? 'sel' : ''}" data-go="p=chat&c=${id}">${lead}<div class="cl"><div class="l1"><span class="ttl">${esc(title)}</span>${c.channel ? ic('mega', 's acc') : ''}${c.priv ? ic('lock', 's dng') : ''}${c.muted ? ic('belloff', 's dim') : ''}<span class="tm">${c.time}</span></div><div class="l2">${sp}<span class="pv">${prev}</span>${c.mention ? '<span class="bd at">@</span>' : ''}${c.unread ? `<span class="bd ${c.muted ? 'mu' : ''}">${c.unread}</span>` : ''}</div></div></div>`;
}
function spaceRow(sp) {
  const s = SPACES[sp]; const ts = topicsOf(sp); const un = spaceUnread(sp);
  const chips = ts.map((t) => { const c = CONVS[t]; return `<span class="tchip ${c.unread ? 'un' : ''}" data-go="p=chat&c=${t}">${c.e} ${esc(c.n)}${c.unread ? ` <b>${c.unread}</b>` : ''}</span>`; }).join('');
  return `<div class="crow" data-go="p=chat&c=${ts[0]}"><span class="av em" style="--h:${s.h}">${s.e}</span><div class="cl"><div class="l1"><span class="ttl">${esc(s.n)}</span>${s.muted ? ic('belloff', 's dim') : ''}<span class="tm">${s.time}</span></div><div class="l2"><span class="chips">${chips}</span>${un ? `<span class="bd ${s.muted ? 'mu' : ''}">${un}</span>` : ''}</div></div></div>`;
}
function rowsHtml() {
  const out = [];
  for (const [t, id] of ORDER) {
    if (t === 'conv') {
      if (!visibleConv(id) || S.folder === 'spaces') continue;
      const c = CONVS[id];
      if (S.folder === 'unread' && !c.unread) continue;
      if (S.folder === 'priv' && c.k !== 'dm' && !c.priv) continue;
      out.push(convRow(id));
    } else {
      if (S.folder === 'priv' || (S.folder === 'unread' && !spaceUnread(id))) continue;
      out.push(spaceRow(id));
    }
  }
  return out.join('') || '<div class="emp">ما في محادثات هون</div>';
}
function listCol() {
  return `<aside class="clist"><div class="chead"><button class="ibtn phn" data-act="drawer" aria-label="القائمة">${ic('menu')}</button><h1>الدردشة</h1><button class="ibtn" data-act="toast" data-msg="البحث بيفتح بكل المحادثات والمساحات">${ic('search')}</button></div><div class="folders">${FOLDERS.map(([k, l]) => `<button class="fold ${S.folder === k ? 'on' : ''}" data-folder="${k}">${l}</button>`).join('')}</div><div class="rows">${rowsHtml()}</div><button class="ibtn fab phn" data-act="toast" data-msg="رسالة جديدة" aria-label="رسالة جديدة">${ic('pencil')}</button></aside>`;
}
function lastTextAck(m) { const a = m.ack; return `<div class="ackb"><span class="must">${ic('mega', 's')} لازم ينقرأ</span><span class="chip ac">قرأ ${a.read} من ${a.total}</span>${a.mine ? '' : `<button class="btn sm ton" data-act="ack" data-id="${m.id}">${ic('check', 's')} قرأت ✓</button>`}</div>`; }
function ticketChip(key) {
  const t = TICKETS.find((x) => x.key === key); if (!t) return '';
  const done = S.res[t.key] || t.st === 'done';
  return done ? `<div><span class="tkc done" data-go="p=work&tab=tickets"><span class="st">✅ انحلّت</span>${t.key}</span></div>`
    : `<div><span class="tkc" data-go="p=work&tab=tickets"><span class="st">●</span>${t.key} · مع ${PEOPLE[t.who].n}</span></div>`;
}
function productMini(pid) {
  const p = PRODUCTS[pid]; if (!p) return '';
  return `<div class="pc"><div class="pct">${art(p.art, p.hue, 'th')}<div><b>${esc(p.n)}</b><small>${esc(p.cat)}</small></div></div><div class="prs">${p.prices.map((x) => `<span class="pr">${x.t} <b>${x.p}</b></span>`).join('')}</div><button class="btn sm ton" data-go="p=library&tab=products&o=product:${pid}">${ic('link', 's')} افتح الكرت</button></div>`;
}
function checkHtml(m) {
  const flags = m.items.map((it, j) => checkDone(`${m.id}:${j}`));
  const done = flags.filter(Boolean).length;
  const rows = m.items.map((it, j) => { const on = flags[j]; return `<button class="cki ${on ? 'dn' : ''}" data-act="tick" data-key="${m.id}:${j}"><span class="cb">${on ? ic('check', 's') : ''}</span><span class="ckx"><span class="ckl">${esc(it.x)}</span>${on && it.by ? `<small>خلّصها ${esc(PEOPLE[it.by].n)} · ${it.at}</small>` : ''}</span></button>`; }).join('');
  return `<div class="ck"><div class="ckt">☑️ ${esc(m.title)}</div><div class="ckp"><i style="inline-size:${(done / m.items.length) * 100}%"></i></div>${rows}<div class="ckf"><span>${done} من ${m.items.length}</span><button class="lnk" data-act="toast" data-msg="انضاف بند جديد">+ أضف بند</button></div></div>`;
}
const bars = (seed) => Array.from({ length: 28 }, (_, i) => `<i style="block-size:${25 + ((i * 37 + seed.length * 11) % 70)}%"></i>`).join('');
function msgHtml(c, m, prev, next) {
  if (m.kind === 'calls') return `<div class="svc">${ic('phone', 's')} ${m.n} مكالمات</div>`;
  const out = m.from === 'me';
  const topic = c.k === 'topic';
  const first = !prev || prev.from !== m.from || prev.kind === 'calls';
  const last = !next || next.from !== m.from || next.kind === 'calls';
  const day = m.d ? `<div class="svc">${m.d}</div>` : '';
  const sep = m.unread && !(prev && prev.unread) ? '<div class="unsep">رسائل غير مقروءة</div>' : '';
  const showName = topic && !out && first;
  const ava = topic && !out ? `<span class="avs">${first ? av(m.from, 'sm') : ''}</span>` : '';
  const blk = ['check', 'album', 'voice', 'card', 'notice'].includes(m.kind) ? ' blk' : '';
  let inner = '';
  if (m.reply) { const r = findMsg(m.reply); if (r) inner += `<div class="rp"><b>${esc(r.from === 'me' ? 'أنت' : PEOPLE[r.from].n)}</b><span>${esc(kindLabel(r))}</span></div>`; }
  if (m.kind === 'check') inner += checkHtml(m);
  else if (m.kind === 'album') inner += `<div class="alb">${art('bottle', 10, 'v1')}${art('box', 200, 'v2')}${art('device', 330, 'v1')}</div>${m.text ? `<span class="tx">${fmt(m.text)}</span>` : ''}`;
  else if (m.kind === 'voice') inner += `<div class="vn"><span class="vplay">${ic('play', 's')}</span><span class="wfm">${bars(m.id)}</span><span class="vd">${m.dur}</span></div>`;
  else if (m.kind === 'card') inner += productMini(m.pid);
  else if (m.kind === 'notice') inner += `<div class="ckt">${ic('mega', 's acc')} ${esc(m.title)}</div><div class="s2">${esc(m.text)}</div><button class="btn sm ton" data-go="p=library&tab=products&o=product:${m.pid}">افتح الكرت</button>`;
  else inner += `<span class="tx">${fmt(m.text)}</span>`;
  if (m.ticket) inner += ticketChip(m.ticket);
  inner += `<span class="meta">${m.t}${out && m.ticks ? ic(m.ticks > 1 ? 'checks' : 'check', '') : ''}</span>`;
  const react = m.react ? `<div class="reacts">${Object.entries(m.react).map(([e, n]) => `<span class="rc">${e} ${n}</span>`).join('')}</div>` : '';
  const hint = m.hint ? `<div class="hint"><span class="w">⚠️ هاي بيانات زبون — مكانها نظام الطلبات</span><button class="lnk" data-act="toast" data-msg="انفتح إدخال الطلب بنظام الطلبات">🔧 افتحي إدخال الطلب</button></div>` : '';
  const sug = m.suggest ? `<button class="sug" data-act="ticket" data-id="${m.id}">${ic('ticket', 's')} بدك تعمليها تذكرة؟</button>` : '';
  return `${day}${sep}<div class="m ${out ? 'out' : 'in'}${first ? ' first' : ''}${last ? ' last' : ''}${S.f === m.id ? ' hl' : ''}" id="m-${m.id}">${ava}<div class="bw">${showName ? `<div class="who" style="--h:${PEOPLE[m.from].h}">${PEOPLE[m.from].n}</div>` : ''}<div class="b${blk}">${inner}</div>${m.ack ? lastTextAck(m) : ''}${hint}${sug}${react}</div><button class="ibtn sm mact" data-act="menu" data-id="${m.id}" aria-label="خيارات">${ic('more', 's')}</button></div>`;
}
function slashHtml() {
  const items = [['منتج', 'box', '/منتج ', 'ابحثي عن كرت منتج'], ['آراء', 'star', '/آراء ', 'صور آراء الزباين'], ['رد', 'reply', '/رد ', 'جواب جاهز من الكروت'], ['طلب', 'ticket', '/طلب ', 'حالة طلب برقمه'], ['مشكلة', 'ticket', '/مشكلة ', 'تذكرة من هالرسالة'], ['مشرفتي', 'user', '/مشرفتي ', 'تذكرة لمشرفتك'], ['إعلان', 'mega', '/إعلان ', 'إعلان لازم ينقرأ']];
  return `<div class="slash" id="slash" ${S.slash ? '' : 'hidden'}><div class="slh">الأوامر</div>${items.map(([n, i, cmd, d]) => `<button class="sl" data-act="slashPick" data-cmd="${cmd}"><span class="cmd">${ic(i, 's')}</span><span class="g"><b>${n}</b><small>${d}</small></span></button>`).join('')}<div class="slh">كروت المنتجات</div>${Object.entries(PRODUCTS).slice(0, 2).map(([id, p]) => `<button class="sl" data-go="p=library&tab=products&o=product:${id}"><span class="cmd">${ic('box', 's')}</span><span class="g"><b>${esc(p.n)}</b><small>${p.prices[0].t} ${p.prices[0].p} · ${esc(p.cat)}</small></span></button>`).join('')}</div>`;
}
function convCol() {
  const c = CONVS[S.c];
  if (!c) return '<section class="conv"></section>';
  const isDm = c.k === 'dm';
  const title = isDm ? PEOPLE[c.who].n : c.n;
  const sub = isDm ? (c.online ? 'متصل الآن' : 'آخر ظهور أمس') : c.k === 'saved' ? 'رسائلك الشخصية' : `${SPACES[c.sp].n} · ${SPACES[c.sp].members} عضو${c.priv ? ` · 🔒 خاص · ${c.priv}` : ''}`;
  const lead = isDm ? av(c.who) : c.k === 'saved' ? `<span class="av sv">${ic('save', 's')}</span>` : `<span class="av em" style="--h:${hueOf(c.sp)}">${c.e}</span>`;
  const head = `<header class="cvh"><button class="ibtn phn" data-go="p=chat" aria-label="رجوع">${ic('right')}</button>${lead}<div class="g" data-act="info"><div class="t">${esc(title)}</div><div class="s">${sub}</div></div><button class="ibtn" data-act="toast" data-msg="البحث داخل المحادثة">${ic('search')}</button>${isDm ? `<button class="ibtn" data-act="toast" data-msg="مكالمة تجريبية">${ic('phone')}</button>` : ''}<button class="ibtn" data-act="info" aria-label="معلومات">${ic('info')}</button></header>`;

  const list = MSGS[S.c] || [];

  const foot = canPost ? `<div class="composer"><div class="cbox"><button class="ibtn sm" data-act="toast" data-msg="الإيموجي بالنسخة الكاملة">${ic('smile', 's')}</button><textarea id="ta" rows="1" placeholder="رسالة" aria-label="رسالة"></textarea><button class="ibtn sm" data-act="toast" data-msg="المرفقات: صورة، ملف، استطلاع، قائمة مهام">${ic('clip', 's')}</button></div><button class="sendb" id="sendb" data-act="sendbtn" aria-label="إرسال">${ic('mic', 'mi2')}${ic('send', 'se')}</button></div>`
    : `<div class="nopost">${ic('lock', 's')} بس المشرفين بينشروا هون</div>`;
  return `<section class="conv">${head}${pin}${pv}<div class="vp"><div class="scroll" id="scroll"><div class="msgs">${msgs}</div></div></div>${slashHtml()}<div class="cwrap">${reply}${foot}</div></section>`;
}

// ---------- work ----------
function taskRow(t) {
  const done = isDone(t); const st = STG[done ? 'DONE' : t.st]; const sp = SPACES[t.sp];
  return `<div class="row tkr"><button class="cbx ${done ? 'dn' : ''}" data-act="done" data-id="${t.id}" aria-label="خلّصتها">${done ? ic('check', 's') : ''}</button><div class="g"><div class="t" style="${done ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(t.x)}</div><div class="s">${esc(sp.n)} · ${esc(t.pr)}${t.src ? ` · <span class="tchip">من ${esc(t.src)}</span>` : ''}</div></div><div class="meta2">${t.auto ? '<span class="chip">آلي</span>' : ''}${t.vis === 'p' ? ic('lock', 's dim') : ''}<span class="chip ${st.c}">${st.n}</span>${t.due ? `<span class="s2">${esc(t.due)}</span>` : ''}${t.who ? av(t.who, 'sm') : '<span class="chip">بدون مسؤول</span>'}</div></div>`;
}
function boardView(list) {
  return `<div class="kan">${['TODO', 'DOING', 'REVIEW', 'DONE'].map((c) => { const ts = list.filter((t) => (isDone(t) ? 'DONE' : t.st) === c); return `<div class="kcol"><h3>${STG[c].n}<span class="bd">${ts.length}</span></h3>${ts.map((t) => `<div class="kc"><b>${esc(t.x)}</b><div class="f"><span class="spc">${esc(SPACES[t.sp].n)}</span>${t.who ? av(t.who, 'sm') : ''}</div></div>`).join('') || '<div class="s2">—</div>'}</div>`; }).join('')}</div>`;
}
function mineView() {
  const sc = (k, l) => `<button class="${S.scope === k ? 'on' : ''}" data-act="scope" data-id="${k}">${l}</button>`;
  const vw = (k, l, i) => `<button class="${S.view === k ? 'on' : ''}" data-act="view" data-id="${k}">${ic(i, 's')}${l}</button>`;
  const list = TASKS.filter((t) => (S.scope === 'mine' ? t.who === 'me' : t.sp === S.space && (t.vis === 's' || t.who === 'me')));
  const hidden = S.scope === 'space' ? TASKS.filter((t) => t.sp === S.space && t.vis === 'p' && t.who !== 'me').length : 0;
  const bar = `<div class="tb"><div class="seg">${sc('mine', 'أنا')}${sc('space', 'المساحة')}</div><div class="seg">${vw('list', 'قائمة', 'list')}${vw('board', 'لوحة', 'board')}</div>${S.scope === 'space' ? `<span class="chip">${SPACES[S.space].e} ${esc(SPACES[S.space].n)}</span>` : ''}${hidden ? `<span class="s2">${ic('lock', 's')} ${hidden} مهمة خاصة لغيرك ما بتنظهر هون</span>` : ''}</div>`;
  if (S.view === 'board') return bar + boardView(list);
  const groups = [['late', 'متأخرة'], ['today', 'اليوم'], ['week', 'هالأسبوع'], ['done', 'خلصت']];
  return bar + groups.map(([g, l]) => { const ts = list.filter((t) => (isDone(t) ? 'done' : t.g) === g); return ts.length ? `<div class="grp">${l} · ${ts.length}</div><div class="list">${ts.map(taskRow).join('')}</div>` : ''; }).join('') || '<div class="emp">ما في مهام هون</div>';
}
function reqView() {

function sectionText(p, key) {
  if (key === 'offer') return [p.n, p.tag, ...p.prices.map((x) => `${x.t}: ${x.p}${x.each ? ` (${x.each})` : ''}`), p.delivery].filter(Boolean).join('\n');
  if (key === 'all') return [sectionText(p, 'offer'), ...p.sections.map((s) => sectionText(p, 's:' + s.k))].join('\n\n');
  if (key === 'faq') return p.faq.map((f) => `${f.q}\n${f.a}`).join('\n\n');
  if (key.startsWith('q:')) { const f = p.faq[+key.slice(2)]; return `${f.q}\n${f.a}`; }
  if (key.startsWith('s:')) {
    const s = p.sections.find((x) => x.k === key.slice(2)); if (!s) return '';
    if (s.kind === 'text') return `${s.t}\n${s.text}`;
    if (s.kind === 'steps') return `${s.t}\n${s.items.map((x, i) => `${i + 1}. ${x}`).join('\n')}`;
    return `${s.t}: ${s.items.join('، ')}${s.not ? `\nما بينفع لـ: ${s.not.join('، ')}` : ''}`;
  }
  return '';
}
const secBody = (s) => s.kind === 'text' ? `<p>${esc(s.text)}</p>`
  : s.kind === 'steps' ? `<ol class="steps">${s.items.map((x) => `<li><span>${esc(x)}</span></li>`).join('')}</ol>`
  : `<div class="chips">${s.items.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>${s.not ? `<div class="s2" style="margin-block-start:8px">ما بينفع لـ:</div><div class="chips">${s.not.map((x) => `<span class="chip dg">${esc(x)}</span>`).join('')}</div>` : ''}`;
function gallery(id, p) {
  if (!p.fb) return '<p class="dim">ما في آراء بعد</p>';

  for (let i = 0; i < p.fb; i++) {
    const key = id + ':' + i; const pend = id === 'harak' && i === p.fb - 1; const on = !!S.fbSel[key];
    items.push(`<button class="fbi ${on ? 'on' : ''} ${pend ? 'pend' : ''}" data-act="fbsel" data-key="${key}" data-pend="${pend ? 1 : 0}">${art(['box', 'shirt', 'bottle', 'device'][i % 4], (p.hue + i * 25) % 360, 'v' + ((i % 2) + 1))}<span class="sel">${on ? ic('check', 's') : ''}</span>${pend ? '<span class="pl">بانتظار موافقة الزبونة</span>' : ''}</button>`);

      return `<p class="s2" style="margin-block-end:10px">${ANOTE.company}</p><div class="list">${[['اسم الشركة', 'شركة زاكي للتجربة'], ['أيام الدوام', 'السبت – الخميس'], ['ترتيب القائمة للكل', 'مفعّل'], ['التبويبات المثبّتة بالشغل', 'مهامي، الطلبات'], ['إعدادات الدردشة للشركة', 'افتراضي']].map(([a, b]) => `<div class="row"><div class="g"><div class="t">${a}</div></div><span class="s2">${b}</span></div>`).join('')}</div>`;
    default:
      return `<p class="s2">${ANOTE[S.sec] || ''}</p>`;
  }
}
function adminPage() {
  const nav = ASEC.map(([k, l, i]) => `<button class="adi ${S.sec === k ? 'on' : ''}" data-go="p=admin&sec=${k}">${ic(i, 's')}${l}</button>`).join('');
  return pbar('لوحة التحكم') + `<div class="adm"><nav class="adl">${nav}</nav><div class="adr">${adminBody()}</div></div>`;
}

// ---------- settings ----------
function chatSettings() {
  const fs = `<div class="seg wide">${[[0.9, 'صغير'], [1, 'عادي'], [1.15, 'كبير']].map(([v, l]) => `<button class="${S.fs === v ? 'on' : ''}" data-act="fs" data-id="${v}">${l}</button>`).join('')}</div>`;
  const wps = `<div class="swt"><button class="swb ${S.plain ? 'on' : ''}" data-act="wp" data-id="plain" style="${esc('--p:none;--pattern:transparent')}">بدون</button>${WP_NAMES.map((n, i) => `<button class="swb ${!S.plain && S.wp === i ? 'on' : ''}" data-act="wp" data-id="${i}" style="${esc('--p:' + wpUrl(i))}">${n}</button>`).join('')}</div>`;
  const TH = [['light', 'سماء', '#e9eff4'], ['dark', 'ليل أزرق', '#0e1621'], ['night', 'الليل (القديم)', '#1b1f2a'], ['day', 'اليوم (القديم)', '#f4efe4'], ['islamic-epic', 'إسلامي', '#2c3b2a'], ['neon-coast', 'نيون', '#0b1f2a']];
  const themes = `<div class="thc">${TH.map(([k, l, c]) => `<button class="thb ${S.theme === k ? 'on' : ''}" data-act="theme" data-id="${k}"><i style="background:${c}"></i>${l}</button>`).join('')}</div>`;
  const prev = `<div class="prev" style="${esc('--wp:' + (S.plain ? 'none' : wpUrl(S.wp)) + (S.plain ? ';--pattern:transparent' : ''))}"><div class="m in"><div class="bw"><div class="b"><span class="tx">صباح الخير 🌷 شو الأخبار؟</span></div></div></div><div class="m out"><div class="bw"><div class="b"><span class="tx">تمام، الطلب مشى.</span></div></div></div></div>`;
  return `<div class="grp">حجم الخط</div>${fs}<div class="grp">الخلفية</div>${wps}${prev}<div class="grp">المظهر</div>${themes}<div class="grp">شكل الفقاعات</div><div class="seg wide"><button class="on" data-act="toast" data-msg="الفقاعات">فقاعات</button><button data-act="toast" data-msg="كلاسيكي">كلاسيكي</button></div><div class="grp">الأرقام</div><div class="seg wide"><button class="on" data-act="toast" data-msg="123">123</button><button data-act="toast" data-msg="١٢٣">١٢٣</button></div><div class="grp">مفتاح الإرسال</div><div class="seg wide"><button class="on" data-act="toast" data-msg="إنتر يبعت">إنتر</button><button data-act="toast" data-msg="Ctrl + إنتر يبعت">Ctrl+إنتر</button></div><div class="grp">التفاعل السريع</div><div class="qr">${['👍', '❤️', '😂', '😮', '😢', '🙏'].map((e) => `<button data-act="toast" data-msg="انحفظ التفاعل ${e}">${e}</button>`).join('')}</div>`;
}
function setBody(s) {
  if (s.k === 'chat') return chatSettings();
  const warn = s.warn ? `<div class="wf"><span class="w">⚠️ ${s.warn[0]}</span><span>🔧 ${s.warn[1]}</span></div>` : '';
  const head = s.k === 'acc' ? `<div class="card" style="display:flex;gap:12px;align-items:center"><span class="av lg" style="--h:212">أ</span><div class="g"><b>أنت</b><small>@zaki_demo · المالك</small></div></div>` : '';
  const rows = s.rows ? s.rows.map((r, i) => {
    const [t, label, val] = r;
    if (t === 'h') return `<div class="grp">${label}</div>`;
    if (t === 's') return `<div class="srow"><div class="g">${label}</div>${swHtml('set.' + s.k + '.' + i, val)}</div>`;
    if (t === 'v') return `<div class="srow"><div class="g">${label}</div><span class="s2">${esc(val)}</span></div>`;
    return `<div class="srow" data-act="toast" data-msg="${label}" style="cursor:pointer"><div class="g"><b class="lnk">${label}</b></div>${ic('left', 's dim')}</div>`;
  }).join('') : '';
  return `${head}${warn}<div class="list" style="margin-block-start:8px;padding-inline:14px">${rows}</div>`;
}
function setPage() {
  const cur = SETS.find((s) => s.k === S.setsec) || SETS[0];
  const list = SETS.map((s) => `<button class="srow" data-act="setsec" data-id="${s.k}" style="padding-inline:14px;${s.k === cur.k ? 'background:var(--accentsoft)' : ''}"><span class="sico" style="--h:${s.h}">${ic(s.i, 's')}</span><span class="g"><b>${s.n}</b></span>${ic('left', 's dim')}</button>`).join('');
  return pbar('الإعدادات') + `<div class="set" style="position:relative;flex:1;min-block-size:0;display:flex"><div class="setl ${S.setOpen ? '' : ''}">${list}</div><div class="setr ${S.setOpen ? 'open' : ''}"><div class="pnh" style="border-radius:0"><button class="ibtn phn" data-act="setBack" aria-label="رجوع">${ic('right')}</button><b>${esc(cur.n)}</b></div><div class="in" style="padding-block-start:12px">${setBody(cur)}</div></div></div>`;
}

// ---------- shell ----------
function railHtml() {
  const unread = Object.values(CONVS).reduce((n, c) => n + (c.unread || 0), 0);
  const item = (p, i, label, badge = '') => `<button class="rb ${S.p === p ? 'on' : ''}" data-go="p=${p}">${ic(i, 'l')}${label}${badge}</button>`;
  return `<nav class="rail" aria-label="الأقسام"><div class="logo">ز</div>${item('chat', 'chat', 'الدردشة', unread ? `<span class="bd">${unread}</span>` : '')}${item('work', 'work', 'الشغل', `<span class="bd">${REQS.filter((r) => !S.req[r.id]).length}</span>`)}${item('library', 'lib', 'المكتبة')}<button class="rb" data-act="toast" data-msg="نتفرّج سوا ما بتنعرض بالمعاينة">${ic('tv', 'l')}نتفرّج سوا</button>${item('admin', 'admin', 'الإدارة')}<div class="grow"></div>${item('settings', 'gear', 'الإعدادات')}</nav>`;
}
function drawer() {
  const items = [['p=chat', 'chat', 'الدردشة'], ['p=work', 'work', 'الشغل'], ['p=library', 'lib', 'المكتبة'], ['p=admin', 'admin', 'الإدارة'], ['p=settings', 'gear', 'الإعدادات']];
  return `<div class="scrim" data-act="close"></div><aside class="drawer"><div class="dh"><div class="r"><span class="av" style="--h:212">أ</span><div class="g"><b>أنت</b><small>@zaki_demo</small></div></div><button class="chip" data-act="toast" data-msg="تبديل المساحة: بتشوفي كل المساحات وعدّاد غير المقروء لكل وحدة">${SPACES.orders.e} ${SPACES.orders.n} ⌄</button></div><div class="list" style="margin:8px">${items.map(([h, i, l]) => `<button class="srow" data-go="${h}" style="padding-inline:14px">${ic(i, 's')}<span class="g"><b>${l}</b></span></button>`).join('')}<button class="srow" data-go="p=chat&c=saved" style="padding-inline:14px">${ic('save', 's')}<span class="g"><b>الرسائل المحفوظة</b></span></button><button class="srow" data-act="toast" data-msg="دليل زاكي قريب" style="padding-inline:14px">${ic('help', 's')}<span class="g"><b>دليل زاكي</b></span></button></div></aside>`;
}
function msgMenu(id) {
  const m = findMsg(id); const own = m && m.from === 'me';
  const it = (act, i, label, cls = '', attrs = '') => `<button class="mi ${cls}" data-act="${act}" ${attrs}>${ic(i, 's')}${label}</button>`;
  return `<div class="scrim cl" data-act="close"></div><div class="menu" style="inset-inline-end:28px;inset-block-start:110px"><div class="qr">${['👍', '❤️', '😂', '😮', '😢', '🙏'].map((e) => `<button data-act="rxn" data-e="${e}">${e}</button>`).join('')}</div>${it('reply', 'reply', 'رد')}${it('copyMsg', 'copy', 'نسخ')}${it('toast', 'link', 'نسخ الرابط', '', 'data-msg="انتسخ الرابط"')}${it('toast', 'pin', 'ثبّت', '', 'data-msg="انثبّتت عندك بس"')}${it('toast', 'fwd', 'حوّل', '', 'data-msg="اختاري المحادثة"')}<div class="msep"></div>${it('task', 'check', 'اعمل مهمة')}${it('ticket', 'ticket', '🎫 مشكلة', '', `data-id="${id}"`)}${it('toast', 'clock', 'ذكّرني', '', 'data-msg="بذكّرك بعد ساعة"')}${it('toast', 'globe', 'ترجم', '', 'data-msg="الترجمة مطفية — الشغّال بالإعدادات"')}${it('toast', 'star', 'ضيفه كجواب جاهز', '', 'data-msg="انضاف للكرت كجواب جاهز"')}${own ? `<div class="msep"></div>${it('toast', 'bolt', 'عدّل', '', 'data-msg="التعديل بيضل بأرشيف المالك"')}${it('toast', 'trash', 'احذف', 'dg', 'data-msg="انحذفت عندك"')}` : ''}<div class="mnote">${ic('info', 's')} الرسائل المحذوفة بتضل بأرشيف المالك</div></div>`;
}
function overlays() {
  let o = '';
  if (S.menu) o += msgMenu(S.menu);
  if (S.drawer) o += drawer();
  if (S.prod && S.p === 'library') o += productPanel(S.prod);
  if (S.collage) o += collage();
  o += `<div class="toasts">${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}</div>`;
  return o;
}
function page() {
  if (S.p === 'work') return workPage();
  if (S.p === 'library') return libPage();
  if (S.p === 'admin') return adminPage();
  if (S.p === 'settings') return setPage();
  return chatPage();
}
const appVars = () => `--fs:${S.fs};--wp:${S.plain ? 'none' : wpUrl(S.wp)};${S.plain ? '--pattern:transparent;' : ''}`;
function frame() {
  const dev = S.mode === 'phone' ? { w: 375, h: 812, cls: 'phone' } : { w: 1180, h: 720, cls: 'desk' };
  const ti = TOUR.findIndex((t) => t.h === location.hash.slice(1));
  const bar = `<div class="mk-bar"><div class="mk-t">معاينة زاكي — الشكل الجديد<small>بيانات وهمية · مش الموقع الحقيقي</small></div><div class="mk-sp"></div><div class="mk-seg"><button class="${S.mode === 'desk' ? 'on' : ''}" data-act="mode" data-id="desk">${ic('desk', 's')}<span class="mk-dev">حاسوب</span></button><button class="${S.mode === 'phone' ? 'on' : ''}" data-act="mode" data-id="phone">${ic('mob', 's')}<span class="mk-dev">جوال</span></button></div><button class="mk-btn" data-act="theme" title="فاتح / غامق">${ic('moon', 's')}</button></div>`;
  const tour = `<div class="mk-tour"><b>جولة:</b>${TOUR.map((t, i) => `<button class="${i === ti ? 'on' : ''}" data-act="tour" data-id="${i}">${i + 1}. ${t.n}</button>`).join('')}</div>`;
  const cap = `<div class="mk-cap">${ti >= 0 ? esc(TOUR[ti].cap) : ''}</div>`;
  return bar + tour + cap + `<div class="mk-stage" id="stage"><div class="mk-fit" id="fit"><div class="device ${dev.cls}" id="dev" style="width:${dev.w}px;height:${dev.h}px">${S.mode === 'phone' ? '<div class="sbar"><span>9:41</span><span>●●●</span></div>' : ''}<div class="app" id="app" style="${esc(appVars())}">${railHtml()}<div class="main">${page()}</div>${overlays()}</div></div></div></div>`;
}
function fit() {
  const st = document.getElementById('stage'), fitEl = document.getElementById('fit'), dev = document.getElementById('dev');
  if (!st || !fitEl || !dev) return;
  const W = parseFloat(dev.style.width), H = parseFloat(dev.style.height);
  const k = Math.min(1, (st.clientWidth - 24) / W, (st.clientHeight - 24) / H);
  fitEl.style.width = W * k + 'px'; fitEl.style.height = H * k + 'px';
  dev.style.transform = `scale(${k})`;
}
function setMeta() {
  const m = document.querySelector('meta[name="color-scheme"]');
  if (m) m.content = S.theme === 'auto' ? 'light dark' : (S.theme === 'dark' || S.theme === 'night' || S.theme === 'neon-coast' || S.theme === 'islamic-epic' ? 'dark' : 'light');
}
function render() {
  const root = document.getElementById('root');
  const SEL = '.scroll,.rows,.body,.adr,.setr,.pnb,.adl,.setl';
  const keep = [...root.querySelectorAll(SEL)].map((e) => e.scrollTop);
  const prevKey = root.dataset.key || '';
  const key = S.p + '|' + S.c + '|' + (S.f || '');
  const ta = document.getElementById('ta');
  const had = !!ta && document.activeElement === ta;
  const val = ta ? ta.value : '';
  setMeta();
  root.innerHTML = frame();
  root.dataset.key = key;
  root.querySelectorAll(SEL).forEach((e, i) => { if (keep[i] != null) e.scrollTop = keep[i]; });
  const sc = document.getElementById('scroll');
  if (sc && prevKey !== key) {
    const hl = S.f && document.getElementById('m-' + S.f);
    if (hl) hl.scrollIntoView({ block: 'center' }); else sc.scrollTop = sc.scrollHeight;
  }
  const nta = document.getElementById('ta');
  if (nta) { nta.value = val; if (val.trim()) { const b = document.getElementById('sendb'); if (b) b.classList.add('has'); } if (had) nta.focus(); }
  fit();
}

// ---------- actions ----------
function send() {
  const ta = document.getElementById('ta');
  const txt = ta ? ta.value.trim() : '';
  if (!txt) return;
  const cur = S.c; const c = CONVS[cur];
  const list = MSGS[cur] || (MSGS[cur] = []);
  const reply = S.reply; S.reply = null;
  list.push({ id: 'x' + Date.now(), from: 'me', t: nowT(), text: txt, ticks: 1, reply: reply || undefined });
  if (ta) ta.value = '';
  render();
  if (c.k === 'saved' || c.channel) return;
  const who = c.k === 'dm' ? c.who : 'hala';
  setTimeout(() => {
    const arr = MSGS[cur] || [];
    arr.push({ id: 'y' + Date.now(), from: who, t: nowT(), text: AUTOREPLY[arr.length % AUTOREPLY.length] });
    if (S.c === cur && S.p === 'chat') render();
  }, 1300);
}
const A = {
  drawer() { S.drawer = true; render(); },
  close() { S.menu = null; S.drawer = false; S.collage = false; S.slash = false; render(); },
  info() { S.info = !S.info; render(); },
  menu(el) { S.menu = el.dataset.id; render(); },
  rxn(el) { const m = findMsg(S.menu); if (m) { m.react = m.react || {}; m.react[el.dataset.e] = (m.react[el.dataset.e] || 0) + 1; } S.menu = null; showToast('انضاف التفاعل'); },
  reply() { S.reply = S.menu; S.menu = null; render(); },
  cancelReply() { S.reply = null; render(); },
  copyMsg() { const m = findMsg(S.menu); S.menu = null; copyText(m ? (m.text || '') : '', 'انتسخت الرسالة'); },
  task() { S.menu = null; showToast('انعملت مهمة من الرسالة، بصندوق المهام'); },
  ticket(el) { S.menu = null; S.slash = false; showToast('انفتحت تذكرة من الرسالة، وبتوصل للمسؤولة'); },
  toast(el) { S.menu = null; showToast(el.dataset.msg || ''); },
  ack() { showToast('انحسب: قرأتِ ✓'); },
  sendbtn() { send(); },
  slashPick(el) { const ta = document.getElementById('ta'); if (ta) ta.value = el.dataset.cmd; S.slash = false; render(); },
  tour(el) { location.hash = TOUR[+el.dataset.id].h; },
  mode(el) { S.mode = el.dataset.id; render(); },
  theme(el) {
    if (el.dataset.id) { S.theme = el.dataset.id; if (!['light', 'dark'].includes(S.theme)) { showToast('هالشكل القديم بيضل متاح بالموقع'); return; } }
    else { const eff = S.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme; S.theme = eff === 'dark' ? 'light' : 'dark'; }
    render();
  },
  fs(el) { S.fs = +el.dataset.id; render(); },
  wp(el) { if (el.dataset.id === 'plain') S.plain = true; else { S.plain = false; S.wp = +el.dataset.id; } render(); },
  setsec(el) { S.setsec = el.dataset.id; S.setOpen = true; render(); },
  setBack() { S.setOpen = false; render(); },
  sw(el) { const k = el.dataset.key; S.sw[k] = !isOn(k, el.dataset.def === '1'); render(); },
  acc(el) { const id = el.dataset.id; S.acc[id] = !isOpen(id); render(); },
  fbsel(el) {
    if (el.dataset.pend === '1') { showToast('لازم الزبونة توافق أول'); return; }
    const k = el.dataset.key; S.fbSel[k] = !S.fbSel[k]; render();
  },
  collage() { S.collage = true; render(); },
  copyOffer() { copyText(sectionText(PRODUCTS[S.prod], 'offer'), 'انتسخت رسالة العرض ✓'); },
  copyAll() { copyText(sectionText(PRODUCTS[S.prod], 'all'), 'انتسخ الكل ✓'); },
  copyText(el) { const p = PRODUCTS[S.prod]; if (p) copyText(sectionText(p, el.dataset.id), 'انتسخ ✓'); },
  done(el) { const id = el.dataset.id; const t = TASKS.find((x) => x.id === id); S.done[id] = !isDone(t); render(); },
  scope(el) { S.scope = el.dataset.id; render(); },
  view(el) { S.view = el.dataset.id; render(); },
  req(el) { S.req[el.dataset.id] = true; showToast(el.dataset.msg + ' ✓'); },
  resolve(el) { S.res[el.dataset.id] = true; showToast('انحلّت التذكرة ✓'); },
  tick(el) { const k = el.dataset.key; S.tk[k] = !checkDone(k); render(); },
  person(el) { S.person = el.dataset.id; render(); },
  tpl(el) { S.tpl[el.dataset.id] = el.dataset.msg; showToast('انطبّق القالب: ' + el.dataset.msg); },
};
function onClick(e) {
  const el = e.target.closest('[data-go],[data-act],[data-folder]');
  if (!el) return;
  if (el.dataset.act && A[el.dataset.act]) { A[el.dataset.act](el); return; }
  if (el.dataset.folder) { S.folder = el.dataset.folder; render(); return; }
  if (el.dataset.go) location.hash = el.dataset.go;
}
document.addEventListener('click', onClick);
document.addEventListener('input', (e) => {
  if (e.target.id === 'ta') {
    const b = document.getElementById('sendb'); if (b) b.classList.toggle('has', e.target.value.trim().length > 0);
    const sl = document.getElementById('slash'); const show = e.target.value.startsWith('/');
    if (sl) sl.hidden = !show; S.slash = show;
  }
  if (e.target.id === 'psearch') {
    const q = e.target.value.trim();
    document.querySelectorAll('#pg .pcard').forEach((el) => { el.hidden = !!q && !(el.dataset.n || '').includes(q); });
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'ta' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); return; }
  if (e.key === 'Escape' && (S.menu || S.drawer || S.collage || S.slash)) A.close();
});
window.addEventListener('hashchange', () => { readHash(); render(); });
window.addEventListener('resize', fit);
readHash();
render();

</script>
